name: Update caps and deploy

on:
  push:
    branches: [main]
  schedule:
    # Wednesdays and Sundays at 06:23 UTC, the mornings after most international-window matches
    - cron: "23 6 * * 0,3"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  update-caps:
    # Pushes deploy straight away; scheduled and manual runs refresh the data first.
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: node scripts/update-caps.mjs
      - name: Commit updated caps
        run: |
          if git diff --quiet data/players.json; then
            echo "Nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/players.json
          git commit -m "Update England caps from Wikipedia"
          git push

  deploy:
    needs: update-caps
    if: ${{ !cancelled() && (needs.update-caps.result == 'success' || needs.update-caps.result == 'skipped') }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Collect site files
        run: |
          mkdir _site
          cp -r index.html data _site/
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4

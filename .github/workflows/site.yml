name: Update caps

# GitHub Pages builds from main, so each data commit redeploys the site on its own.
on:
  schedule:
    # Wednesdays and Sundays at 06:23 UTC, the mornings after most international-window matches
    - cron: "23 6 * * 0,3"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-caps
  cancel-in-progress: false

jobs:
  update-caps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: node scripts/update-caps.mjs
      - name: Commit updated caps
        run: |
          if git diff --quiet data/players.json; then
            echo "Nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/players.json
          git commit -m "Update England caps from Wikipedia"
          git push

